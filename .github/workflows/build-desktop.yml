name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: aarch64
          - os: windows-latest
            platform: windows
            arch: x86_64

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-gnu,${{ matrix.arch }}-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-msvc

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build desktop app
        run: npm run build:desktop

      - name: Rename artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          cd src-tauri/target/release/bundle/appimage
          if [ -f "*.AppImage" ]; then
            mv *.AppImage LARS-Prism-${{ github.ref_name }}.AppImage
          fi

      - name: Rename artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/release/bundle/dmg
          if [ -f "*.dmg" ]; then
            mv *.dmg LARS-Prism-${{ github.ref_name }}-${{ matrix.arch }}.dmg
          fi

      - name: Rename artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          cd src-tauri\target\release\bundle\msi
          if exist "*.msi" (
            for %%F in (*.msi) do ren "%%F" "LARS-Prism-${{ github.ref_name }}.msi"
          )
        shell: cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v3

      - name: Download artifacts
        uses: actions/download-artifact@v3

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/LARS-Prism*.AppImage
            **/LARS-Prism*.dmg
            **/LARS-Prism*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release notes
        run: |
          echo "✅ LARS Prism Desktop v${{ github.ref_name }} released!" >> $GITHUB_STEP_SUMMARY
          echo "📦 Available for:" >> $GITHUB_STEP_SUMMARY
          echo "  • Windows (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "  • macOS (Intel & Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "  • Linux (x86_64)" >> $GITHUB_STEP_SUMMARY
