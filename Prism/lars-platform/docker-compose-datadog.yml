version: '3.8'

services:
  datadog-agent:
    image: gcr.io/datadoghq/agent:7.54.1
    environment:
      - DD_SITE=datadoghq.com
      - DD_API_KEY=${DD_API_KEY}
      - DD_APP_KEY=${DD_APP_KEY}
      - DD_ENV=production
      - DD_SERVICE=lars-prism
      - DD_VERSION=1.0.0
      - DD_APM_ENABLED=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      # Database Monitoring - PostgreSQL (Local)
      - DD_DATABASE_MONITORING_ENABLED=true
      - DD_POSTGRES_ENABLED=true
      - DD_POSTGRES_HOST=db
      - DD_POSTGRES_PORT=5432
      - DD_POSTGRES_USER=postgres
      - DD_POSTGRES_PASSWORD=${DD_POSTGRES_PASSWORD}
      - DD_POSTGRES_DBNAME=lars
      # Database Monitoring - RDS PostgreSQL Instances
      - DD_AUTO_DISCOVERY_ENABLED=true
      - DD_AUTO_DISCOVERY_INCLUDE={"postgres":{"instances":{"rds":true}}}
      # Profiling Configuration - Performance Analysis
      - DD_PROFILING_ENABLED=${DD_PROFILING_ENABLED:-false}
      - DD_PROFILING_SAMPLE_RATE=${DD_PROFILING_SAMPLE_RATE:-0.05}
      - DD_PROFILING_TAGS=${DD_PROFILING_TAGS:-}
      # RUM (Real User Monitoring) - Frontend Application Performance
      - DD_RUM_ENABLED=${DD_RUM_ENABLED:-false}
      - DD_RUM_APPLICATION_ID=${DD_RUM_APPLICATION_ID:-}
      - DD_RUM_CLIENT_TOKEN=${DD_RUM_CLIENT_TOKEN:-}
      - DD_RUM_SAMPLE_RATE=${DD_RUM_SAMPLE_RATE:-1.0}
      - DD_RUM_SESSION_SAMPLE_RATE=${DD_RUM_SESSION_SAMPLE_RATE:-100}
      - DD_RUM_TRACK_USER_INTERACTIONS=${DD_RUM_TRACK_USER_INTERACTIONS:-true}
      # APM & Tracing
      - DD_TRACE_ENABLED=${DD_TRACE_ENABLED:-true}
      - DD_TRACE_SAMPLE_RATE=${DD_TRACE_SAMPLE_RATE:-1.0}
      # Application Security
      - DD_APPSEC_ENABLED=${DD_APPSEC_ENABLED:-true}
      - DD_APPSEC_WAF_ENABLED=${DD_APPSEC_WAF_ENABLED:-true}
      - DD_APPSEC_SCA_ENABLED=${DD_APPSEC_SCA_ENABLED:-true}
      # Error Tracking
      - DD_ERROR_TRACKING_ENABLED=${DD_ERROR_TRACKING_ENABLED:-true}
      - DD_ERROR_TRACKING_SAMPLE_RATE=${DD_ERROR_TRACKING_SAMPLE_RATE:-1.0}
      # Logging
      - DD_LOGS_INJECTION=${DD_LOGS_INJECTION:-true}
      # LLM Observability
      - DD_LLMOBS_ENABLED=${DD_LLMOBS_ENABLED:-true}
      - DD_LLMOBS_ML_APP=${DD_LLMOBS_ML_APP:-lars-prism-auto}
      # Infrastructure Monitoring
      - DD_SYSTEM_PROBE_ENABLED=${DD_SYSTEM_PROBE_ENABLED:-true}
      - DD_UNIVERSAL_SERVICE_MONITORING_ENABLED=${DD_UNIVERSAL_SERVICE_MONITORING_ENABLED:-true}
      # Dynamic Instrumentation
      - DD_DYNAMIC_INSTRUMENTATION_ENABLED=${DD_DYNAMIC_INSTRUMENTATION_ENABLED:-true}
    ports:
      # APM Trace Collection - localhost only (internal communication)
      - "127.0.0.1:8126:8126/tcp"
      # DogStatsD Metrics - localhost only (internal communication)
      - "127.0.0.1:8125:8125/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    # Security: Internal services only
    # For external communication, use network policies or service mesh

networks:
  default:
    driver: bridge
