# Datadog Agent Configuration
# Agent Observability 설정
# SECURITY: API key must be set via DD_API_KEY environment variable
# NEVER commit actual API keys to this file

# API 설정
api_key: ${DD_API_KEY}
site: "datadoghq.com"

# Agent 자체 모니터링 활성화
hostname: "lars-datadog-agent"
tags:
  - "env:production"
  - "service:lars-agent"
  - "stream:multi"

# APM/Tracing 설정
apm_config:
  enabled: true
  # Security: Bind to localhost only for internal communication
  # External access should go through load balancer or service mesh
  bind_host: "127.0.0.1"
  receiver_port: 8126

  # 에이전트 자신의 트레이싱 활성화
  internal_profiling:
    enabled: true

  # Agent Observability 메트릭 수집
  collect_stats: true

# 로그 수집 설정
logs_config:
  enabled: true
  use_tcp: false
  use_udp: true

# 프로세스 모니터링
process_config:
  enabled: true
  intervals:
    process_check: "10s"

# 시스템 메트릭 수집
system_probe_config:
  enabled: true
  network_enabled: true

# 에이전트 성능 메트릭
agent_config:
  enabled: true

# Dogstatsd 설정
dogstatsd_port: 8125
# Security: Disable non-local traffic to restrict to internal communication only
dogstatsd_non_local_traffic: false

# 디버깅 (선택사항)
# log_level: "debug"
log_file: "/var/log/datadog/agent.log"

# 에이전트 자체 메트릭 활성화
enable_metadata_collection: true

# 수집할 기본 메트릭
enable_gohai: true

# 시스템 프로브 (Network 모니터링)
network_config:
  enabled: true

# 컨테이너 모니터링
container_env_as_tags:
  DOCKER_LABELS_AS_TAGS: "true"

# 메타데이터 캐싱
metadata_providers:
  - name: docker
    polling_interval: 5

# OTLP 수신기 (OpenTelemetry 통합)
otlp_config:
  enabled: true
  receiver_protocols:
    grpc:
      enabled: true
      # Security: Localhost only binding
      endpoint: "127.0.0.1:4317"
    http:
      enabled: true
      # Security: Localhost only binding
      endpoint: "127.0.0.1:4318"
