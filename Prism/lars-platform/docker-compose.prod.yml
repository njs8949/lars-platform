version: '3.8'

services:
  # ==================== FastAPI 백엔드 ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: lars-prism-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://prism_user:${POSTGRES_PASSWORD}@postgres:5432/lars_prism
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      # === Datadog APM & Monitoring ===
      - DD_TRACE_ENABLED=true
      - DD_SERVICE=lars-prism-auto
      - DD_ENV=production
      - DD_VERSION=1.0.0
      # === Application Security ===
      - DD_APPSEC_ENABLED=true
      - DD_APPSEC_WAF_ENABLED=true
      - DD_APPSEC_SCA_ENABLED=true
      # === Profiling ===
      - DD_PROFILING_ENABLED=true
      - DD_PROFILING_SAMPLE_RATE=0.1
      # === Error Tracking ===
      - DD_ERROR_TRACKING_ENABLED=true
      # === Log Injection ===
      - DD_LOGS_INJECTION=true
      # === LLM Observability ===
      - DD_LLMOBS_ENABLED=true
      - DD_LLMOBS_ML_APP=lars-prism-auto
      # === Agent Connection ===
      - DD_AGENT_HOST=host.docker.internal
      - DD_AGENT_PORT=8126
      - DD_TRACE_AGENT_PORT=8126
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - prism-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== PostgreSQL 데이터베이스 ====================
  postgres:
    image: postgres:16-alpine
    container_name: lars-prism-postgres
    environment:
      - POSTGRES_DB=lars_prism
      - POSTGRES_USER=prism_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=-c shared_buffers=256MB -c max_connections=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - prism-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis 캐시 & 메시지 큐 ====================
  redis:
    image: redis:7-alpine
    container_name: lars-prism-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - prism-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Nginx 리버스 프록시 ====================
  nginx:
    image: nginx:alpine
    container_name: lars-prism-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/:/etc/nginx/ssl/:ro
      - ./dist:/usr/share/nginx/html/:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - prism-network

  # ==================== Prometheus 모니터링 ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: lars-prism-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - prism-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # ==================== Grafana 대시보드 ====================
  grafana:
    image: grafana/grafana:latest
    container_name: lars-prism-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=grafana_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - prism-network

  # ==================== 로그 수집 (선택사항) ====================
  loki:
    image: grafana/loki:latest
    container_name: lars-prism-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - prism-network
    command: -config.file=/etc/loki/local-config.yml

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  prism-network:
    driver: bridge
