name: Build Desktop Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: LARS Prism.app
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: LARS Prism.app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: "LARS Prism.exe"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: lars-prism

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev

      - name: Install npm dependencies
        run: npm ci
        working-directory: ./Prism/lars-platform

      - name: Build frontend
        run: npm run build
        working-directory: ./Prism/lars-platform

      - name: Build desktop app
        run: npm run build:desktop
        working-directory: ./Prism/lars-platform

      - name: Rename artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          cd ./Prism/lars-platform/src-tauri/target/release/bundle/macos
          mv "LARS Prism.app" "LARS-Prism-v1.4.2-${{ matrix.target }}.app"

      - name: Rename artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          cd ./Prism/lars-platform/src-tauri/target/release
          move "LARS Prism.exe" "LARS-Prism-v1.4.2-windows.exe"

      - name: Rename artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          cd ./Prism/lars-platform/src-tauri/target/release
          mv lars-desktop "LARS-Prism-v1.4.2-linux"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifacts
          path: |
            ./Prism/lars-platform/src-tauri/target/release/bundle/macos/**/*
            ./Prism/lars-platform/src-tauri/target/release/LARS*
